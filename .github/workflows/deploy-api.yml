# 受付窓口（Cloudflare Workers + D1）を作る・更新する
# 必要なもの（Settings → Secrets and variables → Actions → Secrets）
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID：Cloudflareで発行したもの
#   STATS_TOKEN：利用状況ページを見るための合言葉（自分で決める）
#   GH_DISPATCH_TOKEN（任意）：収集プログラムを10分おきに起こすためのGitHubのトークン
#     （Fine-grained token。対象はこのリポジトリだけ、権限は Actions の Read and write だけ）
# Webプッシュの鍵などは初回に自動で作り、Cloudflareの中にだけ保存する（GitHubにもログにも出さない）
name: deploy-api

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/deploy-api.yml"]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
      GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: 設定の確認
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflareのトークンが未登録のため、何もしません"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != '1'
        with:
          node-version: "20"

      - name: 準備
        if: steps.check.outputs.skip != '1'
        run: npm ci --silent

      - name: データベース（D1）を用意
        if: steps.check.outputs.skip != '1'
        run: |
          ID=$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s).find(x=>x.name==="midokoro");process.stdout.write(r?r.uuid:"")})')
          if [ -z "$ID" ]; then
            npx wrangler d1 create midokoro >/dev/null
            ID=$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{process.stdout.write(JSON.parse(s).find(x=>x.name==="midokoro").uuid)})')
          fi
          sed -i "s/__DATABASE_ID__/$ID/" wrangler.toml
          npx wrangler d1 execute midokoro --remote --file=schema.sql --yes >/dev/null

      - name: 窓口を公開
        if: steps.check.outputs.skip != '1'
        run: |
          npx wrangler deploy 2>&1 | tee deploy.log | grep -E "https://.*workers\.dev|Uploaded|Deployed" || true
          URL=$(grep -oE "https://[a-zA-Z0-9.-]+\.workers\.dev" deploy.log | head -1)
          echo "::notice::窓口のURL: $URL （Variables の MIDOKORO_API にこのURLを登録してください）"

      - name: 鍵と合言葉を登録（初回だけ自動生成。値は表示しない）
        if: steps.check.outputs.skip != '1'
        run: |
          HAVE=$(npx wrangler secret list 2>/dev/null || echo "[]")
          if ! echo "$HAVE" | grep -q '"VAPID_PUBLIC"'; then
            node genkeys.mjs > /tmp/keys.json
            for k in VAPID_PUBLIC VAPID_PRIVATE_JWK HASH_SALT; do
              node -e "process.stdout.write(require('/tmp/keys.json')['$k'])" | npx wrangler secret put "$k" >/dev/null
            done
            rm -f /tmp/keys.json
            echo "::notice::Webプッシュの鍵を新しく作りました"
          fi
          if [ -n "$GH_DISPATCH_TOKEN" ]; then
            printf '%s' "$GH_DISPATCH_TOKEN" | npx wrangler secret put GH_DISPATCH_TOKEN >/dev/null
            echo "::notice::収集プログラムを10分おきに起こす設定をしました"
          else
            echo "::warning::GH_DISPATCH_TOKEN が未登録です。収集プログラムは GitHub の schedule だけで起動します"
          fi
          if [ -n "$STATS_TOKEN" ]; then
            printf '%s' "$STATS_TOKEN" | npx wrangler secret put STATS_TOKEN >/dev/null
          else
            echo "::warning::STATS_TOKEN が未登録です。利用状況ページは見られません"
          fi
