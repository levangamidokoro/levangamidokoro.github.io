# Webプッシュのテスト送信（手動実行用）。登録している全員に1通だけ送る
name: push-test
on:
  workflow_dispatch:
    inputs:
      kind:
        description: "full（いま見て！）か geki（激アツ！）"
        default: "geki"
permissions:
  contents: read
  id-token: write
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests
      - name: 送信
        env:
          MIDOKORO_API: ${{ vars.MIDOKORO_API }}
          KIND: ${{ github.event.inputs.kind }}
        run: |
          python - <<'PY'
          import os, push_api
          from midokoro_daemon import gauge_text
          site = "https://levangamidokoro.github.io/"
          if os.environ.get("KIND") == "full":
              n = push_api.send_all("いま見て！ 広島戦（テスト）", f"{gauge_text(100)}\nレバンガが逆転！", site, site + "push-full.png")
          else:
              n = push_api.send_all("激アツ！ 広島戦（テスト）", f"{gauge_text(142)}\nレバンガが逆転！", site, site + "push-burst-5.png")
          print("送れた件数", n)
          PY
