<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>利用状況｜見どころなう</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Dela+Gothic+One&display=swap">
<style>
:root{--bg:#F6F8F1;--ink:#14290F;--sub:#56664F;--line:#DDE6D0;--card:#FFFFFF;--lime:#8FC31F;--mark:#3F7A1A;--wash:rgba(63,122,26,.10)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1A0B;--ink:#E8F0DD;--sub:#9AAA90;--line:#24361F;--card:#122310;--mark:#73A318;--wash:rgba(115,163,24,.14)}}
:root[data-theme="dark"]{--bg:#0D1A0B;--ink:#E8F0DD;--sub:#9AAA90;--line:#24361F;--card:#122310;--mark:#73A318;--wash:rgba(115,163,24,.14)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 "BIZ UDPGothic",system-ui,sans-serif}
.wrap{max-width:880px;margin:0 auto;padding:0 16px}
header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:20px 16px 8px;border-bottom:4px solid var(--lime)}
.mark{font:400 22px/1 "Dela Gothic One",sans-serif;margin:0}
.edition{color:var(--sub);font-size:13px}
h2{font:400 18px/1.3 "Dela Gothic One",sans-serif;margin:32px 0 4px}
.cap{color:var(--sub);font-size:13px;margin:0 0 12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:20px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.tile .k{color:var(--sub);font-size:13px}
.tile .v{font:400 34px/1.2 "Dela Gothic One",sans-serif;font-variant-numeric:tabular-nums}
.tile .d{color:var(--sub);font-size:12px}
.chart{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 8px 4px}
svg{display:block;width:100%;height:auto;overflow:visible}
.axis text{fill:var(--sub);font-size:11px}
.grid line{stroke:var(--line);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:4px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-115%);opacity:0;transition:opacity .1s}
.dev{display:grid;grid-template-columns:72px 1fr 48px;gap:8px;align-items:center;margin:6px 0}
.dev .bar{height:14px;border-radius:0 4px 4px 0;background:var(--mark)}
.dev .n{text-align:right;font-variant-numeric:tabular-nums}
details{margin-top:28px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:right}
th:first-child,td:first-child{text-align:left}
form{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px}
[hidden]{display:none!important}
input{flex:1;min-width:200px;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--card);color:var(--ink);font:inherit}
button{min-height:44px;border:0;border-radius:10px;padding:0 18px;background:var(--lime);color:#14290F;font:700 15px "BIZ UDPGothic",sans-serif;cursor:pointer}
.note{color:var(--sub);font-size:13px}
footer{color:var(--sub);font-size:12px;margin:40px 0 24px}
</style>
</head>
<body data-api="__API__">
<header><h1 class="mark">見どころなう</h1><span class="edition">利用状況（管理用）</span></header>
<main class="wrap">
  <form id="login" hidden>
    <input id="tok" type="password" autocomplete="off" placeholder="閲覧用の合言葉" aria-label="閲覧用の合言葉">
    <button>表示する</button>
    <p class="note" style="flex-basis:100%">合言葉はこの端末にだけ保存されます。</p>
  </form>
  <p class="note" id="msg"></p>
  <div id="out" hidden>
    <div class="tiles" id="tiles"></div>
    <h2>試合ごとの通知と反応</h2>
    <p class="cap">通知を送った試合だけ。タップ率＝通知を開いた回数 ÷ 届けた数。提案資料の数字はここから取ります。</p>
    <div id="games"></div>
    <button type="button" id="csv" style="margin-top:12px">表をCSVで保存</button>
    <h2>日ごとのアクセス数</h2>
    <p class="cap">ページが表示された回数（直近30日）。Cookieは使わず、ロボットは除いています。</p>
    <div class="chart" id="c1"></div>
    <h2>通知の登録数の推移</h2>
    <p class="cap">その日の終わりの登録数（直近30日）。解除や期限切れを差し引いた数です。</p>
    <div class="chart" id="c2"></div>
    <h2>端末ごとの登録数</h2>
    <div id="dev"></div>
    <details><summary>表で見る</summary><div id="tbl"></div></details>
  </div>
  <footer>最終取得 <span id="gen">-</span>　・　<a href="./" style="color:inherit">ページへ戻る</a></footer>
</main>
<script>
(() => {
  const API = document.body.dataset.api;
  const $ = (id) => document.getElementById(id);
  const fmt = (n) => Number(n || 0).toLocaleString("ja-JP");
  const md = (d) => `${+d.slice(5, 7)}/${+d.slice(8, 10)}`;
  let token = "";
  try { token = localStorage.getItem("midokoro_stats") || ""; } catch (e) {}

  if (!API || API.startsWith("__")) { $("msg").textContent = "受付窓口がまだ設定されていません。"; return; }
  $("login").onsubmit = (ev) => { ev.preventDefault(); token = $("tok").value.trim(); load(true); };

  async function load(save) {
    $("msg").textContent = "読み込み中…";
    try {
      const r = await fetch(API + "/api/stats", { headers: { Authorization: "Bearer " + token }, cache: "no-store" });
      if (r.status === 401) { $("login").hidden = false; $("out").hidden = true; $("msg").textContent = token ? "合言葉が違います。" : ""; return; }
      const d = await r.json();
      if (save) { try { localStorage.setItem("midokoro_stats", token); } catch (e) {} }
      $("login").hidden = true; $("msg").textContent = ""; $("out").hidden = false;
      render(d);
    } catch (e) { $("msg").textContent = "読み込めませんでした。時間をおいて開き直してください。"; }
  }

  function render(d) {
    const days = d.days.slice(-30);
    // 登録数の推移：今の登録数から、新しい日の増減を順に引いて戻る
    let cur = d.subscribers; const subs = new Array(days.length);
    for (let i = days.length - 1; i >= 0; i--) { subs[i] = cur; cur -= days[i].sub - days[i].unsub - days[i].gone; }
    const t = days[days.length - 1];
    const sum = (k) => days.reduce((a, x) => a + x[k], 0);
    $("tiles").innerHTML = [
      ["通知の登録数", fmt(d.subscribers), `今日 +${fmt(t.sub)} / −${fmt(t.unsub + t.gone)}`],
      ["今日のアクセス", fmt(t.view), `訪問者 およそ${fmt(t.uniq)}人`],
      ["30日のアクセス", fmt(sum("view")), `1日平均 ${fmt(Math.round(sum("view") / days.length))}`],
      ["30日の通知送信", fmt(sum("push_sent")), `届かなかった ${fmt(sum("push_fail"))}`],
    ].map(([k, v, s]) => `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div><div class="d">${s}</div></div>`).join("");
    columns($("c1"), days.map((x) => ({ x: x.day, y: x.view, tip: `${md(x.day)}　${fmt(x.view)}回（訪問者 およそ${fmt(x.uniq)}人）` })));
    line($("c2"), days.map((x, i) => ({ x: x.day, y: subs[i], tip: `${md(x.day)}　${fmt(subs[i])}件` })));
    const dev = Object.entries(d.by_device || {}).sort((a, b) => b[1] - a[1]);
    const mx = Math.max(1, ...dev.map((e) => e[1]));
    $("dev").innerHTML = dev.length ? dev.map(([k, n]) =>
      `<div class="dev"><span>${k}</span><div class="bar" style="width:${Math.max(2, n / mx * 100)}%"></div><span class="n">${fmt(n)}</span></div>`).join("")
      : '<p class="note">まだ登録はありません。</p>';
    $("tbl").innerHTML = "<table><tr><th>日付</th><th>アクセス</th><th>訪問者</th><th>新規登録</th><th>解除</th><th>期限切れ</th><th>登録数</th><th>通知送信</th></tr>" +
      days.slice().reverse().map((x, j) => { const i = days.length - 1 - j;
        return `<tr><td>${x.day}</td><td>${fmt(x.view)}</td><td>${fmt(x.uniq)}</td><td>${fmt(x.sub)}</td><td>${fmt(x.unsub)}</td><td>${fmt(x.gone)}</td><td>${fmt(subs[i])}</td><td>${fmt(x.push_sent)}</td></tr>`; }).join("") + "</table>";
    games(d.games || []);
    $("gen").textContent = d.generated;
  }

  let gameRows = [];
  const pc = (a, b) => b ? `${Math.round(a / b * 1000) / 10}%` : "-";
  function games(list) {
    gameRows = list.map((g) => {
      const sent = g.sent_full + g.sent_geki, tap = g.tap_full + g.tap_geki;
      return { date: g.date, opp: g.opponent, peak: g.peak, nf: g.notify_full, ng: g.notify_geki, sent, tap, rate: pc(tap, sent),
               geki: g.notify_geki ? pc(g.tap_geki, g.sent_geki) : "-" };
    });
    if (!gameRows.length) { $("games").innerHTML = '<p class="note">まだ試合の通知はありません。次の試合から記録されます。</p>'; $("csv").hidden = true; return; }
    const sent = gameRows.reduce((a, r) => a + r.sent, 0), tap = gameRows.reduce((a, r) => a + r.tap, 0);
    $("games").innerHTML = `<div class="tiles" style="margin-top:0">
      <div class="tile"><div class="k">記録した試合</div><div class="v">${fmt(gameRows.length)}</div><div class="d">通知を送った試合</div></div>
      <div class="tile"><div class="k">届けた通知</div><div class="v">${fmt(sent)}</div><div class="d">端末ごとの合計</div></div>
      <div class="tile"><div class="k">タップ</div><div class="v">${fmt(tap)}</div><div class="d">タップ率 ${pc(tap, sent)}</div></div></div>
      <table style="margin-top:12px"><tr><th>日付</th><th>相手</th><th>最高の熱さ</th><th>いま見て！</th><th>激アツ！</th><th>届けた数</th><th>タップ</th><th>タップ率</th><th>激アツのタップ率</th></tr>` +
      gameRows.map((r) => `<tr><td>${r.date}</td><td>${r.opp}</td><td>${r.peak}%</td><td>${r.nf}回</td><td>${r.ng}回</td><td>${fmt(r.sent)}</td><td>${fmt(r.tap)}</td><td>${r.rate}</td><td>${r.geki}</td></tr>`).join("") + "</table>";
    $("csv").hidden = false;
  }
  $("csv").onclick = () => {
    const head = ["日付", "相手", "最高の熱さ(%)", "いま見て！(回)", "激アツ！(回)", "届けた数", "タップ", "タップ率", "激アツのタップ率"];
    const rows = gameRows.map((r) => [r.date, r.opp, r.peak, r.nf, r.ng, r.sent, r.tap, r.rate, r.geki]);
    const text = "\uFEFF" + [head, ...rows].map((a) => a.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\r\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type: "text/csv" }));
    a.download = `midokoro_games_${new Date().toISOString().slice(0, 10)}.csv`; a.click();
  };

  const W = 820, H = 220, L = 40, R = 12, T = 12, B = 26;
  function nice(max) { if (max <= 4) return 4; const p = Math.pow(10, Math.floor(Math.log10(max))); const m = max / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p; }
  function frame(el, pts) {
    const top = nice(Math.max(...pts.map((p) => p.y), 1));
    const y = (v) => T + (H - T - B) * (1 - v / top);
    const ticks = [0, top / 2, top];
    let g = '<g class="grid">' + ticks.map((v) => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/>`).join("") + "</g>";
    g += '<g class="axis">' + ticks.map((v) => `<text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v >= 1000 ? (v / 1000) + "K" : v}</text>`).join("");
    const step = (W - L - R) / pts.length;
    pts.forEach((p, i) => { if (i % 5 === 0 || i === pts.length - 1) g += `<text x="${L + step * (i + .5)}" y="${H - 6}" text-anchor="middle">${md(p.x)}</text>`; });
    g += "</g>";
    return { y, step, g };
  }
  function hover(el, svg, pts, step, yOf, dotSel) {
    const tip = document.createElement("div"); tip.className = "tip"; el.appendChild(tip);
    const hit = svg.querySelector(".hit");
    const show = (ev) => {
      const r = svg.getBoundingClientRect(); const sx = r.width / W;
      const i = Math.max(0, Math.min(pts.length - 1, Math.floor(((ev.clientX - r.left) / sx - L) / step)));
      tip.textContent = pts[i].tip; tip.style.opacity = 1;
      tip.style.left = (L + step * (i + .5)) * sx + 8 + "px"; tip.style.top = yOf(pts[i].y) * sx + 12 + "px";
      if (dotSel) { const c = svg.querySelector(dotSel); c.setAttribute("cx", L + step * (i + .5)); c.setAttribute("cy", yOf(pts[i].y)); c.style.opacity = 1; }
      svg.querySelectorAll(".col").forEach((b, j) => b.style.opacity = j === i ? 1 : .55);
    };
    hit.addEventListener("pointermove", show); hit.addEventListener("pointerdown", show);
    hit.addEventListener("pointerleave", () => { tip.style.opacity = 0; svg.querySelectorAll(".col").forEach((b) => b.style.opacity = 1); if (dotSel) svg.querySelector(dotSel).style.opacity = 0; });
  }
  function columns(el, pts) {
    const f = frame(el, pts); const bw = Math.min(24, f.step - 2);
    const bars = pts.map((p, i) => { const x = L + f.step * (i + .5) - bw / 2, y0 = f.y(0), y1 = f.y(p.y), h = y0 - y1;
      if (h <= 0) return ""; const r = Math.min(4, h);
      return `<path class="col" fill="var(--mark)" d="M${x},${y0}V${y1 + r}Q${x},${y1} ${x + r},${y1}H${x + bw - r}Q${x + bw},${y1} ${x + bw},${y1 + r}V${y0}Z"/>`; }).join("");
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="日ごとのアクセス数の棒グラフ">${f.g}${bars}<rect class="hit" x="${L}" y="0" width="${W - L - R}" height="${H}" fill="transparent"/></svg>`;
    hover(el, el.querySelector("svg"), pts, f.step, f.y);
  }
  function line(el, pts) {
    const f = frame(el, pts);
    const xy = pts.map((p, i) => [L + f.step * (i + .5), f.y(p.y)]);
    const d = "M" + xy.map((q) => q.join(",")).join("L");
    const area = d + `L${xy[xy.length - 1][0]},${f.y(0)}L${xy[0][0]},${f.y(0)}Z`;
    const last = xy[xy.length - 1];
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="通知の登録数の推移の折れ線グラフ">${f.g}
      <path d="${area}" fill="var(--wash)"/><path d="${d}" fill="none" stroke="var(--mark)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${last[0]}" cy="${last[1]}" r="4.5" fill="var(--mark)" stroke="var(--card)" stroke-width="2"/>
      <circle class="dot" r="4.5" fill="var(--mark)" stroke="var(--card)" stroke-width="2" style="opacity:0"/>
      <rect class="hit" x="${L}" y="0" width="${W - L - R}" height="${H}" fill="transparent"/></svg>`;
    hover(el, el.querySelector("svg"), pts, f.step, f.y, ".dot");
  }

  load(false);
})();
</script>
</body></html>
